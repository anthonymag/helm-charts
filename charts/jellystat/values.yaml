jellystat:
  jwtSecret: change-me

  extraEnv:
    - name: POSTGRES_DB
      valueFrom:
        secretKeyRef:
          name: jellystat-db
          key: db
    - name: JS_GEOLITE_ACCOUNT_ID
      valueFrom:
        secretKeyRef:
          name: jellystat-geolite
          key: account-id
    - name: JS_GEOLITE_LICENSE_KEY
      valueFrom:
        secretKeyRef:
          name: jellystat-geolite
          key: license-key
    - name: TZ
      value: "America/Chicago"

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000

  service:
    type: NodePort

  resources:
    limits:
      cpu: 50m
      memory: 128Mi

  volumes:
    - name: backup-data
      persistentVolumeClaim:
        claimName: jellystat-backup-data

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts:
    - name: backup-data
      mountPath: "/app/backend/backup-data"

  nodeSelector:
    class: sanji

  postgresql:
    existingSecret: "jellystat-db"
